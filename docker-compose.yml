version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: ahhe_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ahhe_db}
      POSTGRES_USER: ${POSTGRES_USER:-ahhe_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ahhe_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ahhe_user} -d ${POSTGRES_DB:-ahhe_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ahhe_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../infra/docker/Dockerfile.backend
    container_name: ahhe_backend
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=1
      - DB_HOST=db
      - DB_NAME=${POSTGRES_DB:-ahhe_db}
      - DB_USER=${POSTGRES_USER:-ahhe_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-ahhe_password}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infra/docker/Dockerfile.frontend
    container_name: ahhe_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
